<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>agent-desk</title>
  <!-- Home-screen app (iPhone: Share → Add to Home Screen) -->
  <!-- use-credentials: the manifest fetch must carry the Cloudflare Access cookie -->
  <link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Desk" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="./style.css" />
  <script>
    // Apply saved theme before first paint (no flash).
    try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header>
    <button id="sbToggle" type="button" aria-label="Toggle sidebar">&#9776;</button>
    <div class="brand"><span class="dot"></span>agent-desk</div>
    <nav id="tabs">
      <button data-mode="ask" class="on">Ask</button>
      <button data-mode="general">General</button>
      <button data-mode="notes">Notes</button>
      <button data-mode="search" title="Search past prompts, answers and tool output">History</button>
      <button data-mode="web" title="Search the web in a new browser tab">Web</button>
      <button id="settingsTab" type="button" aria-expanded="false" title="Design, Code, Usage">Settings ▸</button>
      <button data-mode="design" class="more" hidden>Design</button>
      <button data-mode="code" class="more" hidden>Code</button>
      <button data-mode="usage" class="more" hidden>Usage</button>
    </nav>
    <span id="status">offline</span>
    <button id="termBtn" type="button" title="Terminal (live herdr session). Hold Shift to select text when an app captures the mouse. Copy: select, or Ctrl+Shift+C; paste: Ctrl+Shift+V or right-click.">&gt;_ Terminal</button>
    <button id="healthBtn" type="button">Health</button>
    <button id="theme" type="button">◐ Auto</button>
    <button id="pushBtn" type="button" title="Phone/desktop alerts when a turn finishes or needs approval">🔔 Alerts</button>
  </header>
  <main>
    <aside>
      <h3 id="srcHead">Sources</h3>
      <ul id="sources"></ul>
      <form id="attach">
        <div class="kinds">
          <label><input type="radio" name="kind" value="local" checked /> Local folder</label>
          <label><input type="radio" name="kind" value="url" /> URL</label>
        </div>
        <div class="row">
          <input name="location" list="locs" autocomplete="off" placeholder="~/projects/…" required />
          <button type="button" id="browse">Browse…</button>
          <button class="primary">Attach</button>
        </div>
        <div id="browser" hidden>
          <div class="cwd"></div>
          <ul></ul>
          <div class="row">
            <button type="button" id="pickDir">Select this folder</button>
            <button type="button" id="closeBrowser">Cancel</button>
          </div>
        </div>
        <datalist id="locs"></datalist>
      </form>
      <h3 id="thrHead">Threads</h3>
      <ul id="threads"></ul>
      <button id="newThread" hidden>New</button>
      <button id="resumeBtn" hidden>Resume Claude session…</button>
      <div id="resumeList" hidden><ul></ul><div class="row"><button type="button" id="closeResume">Close</button></div></div>
    </aside>
    <section>
      <div id="notesView" hidden>
        <div class="bar"><button type="button" id="notesPrev">‹</button><input type="date" id="notesDate" /><button type="button" id="notesNext">›</button><button type="button" id="notesToday">Today</button></div>
        <form id="noteAdd"><textarea name="text" rows="2" placeholder="Add a note (turns are recorded automatically)"></textarea><button class="primary">Add note</button></form>
        <div id="notesList"></div>
      </div>
      <div id="cards"></div>
      <form id="prompt"><textarea name="text" rows="3" placeholder="Message (Ctrl+Enter to send)"></textarea><button class="primary">Send</button><button type="button" id="actBtn" title="Commands">⋯</button><div id="actMenu" hidden></div><div id="ctxHint" hidden></div><div id="promptErr" hidden></div></form>
    </section>
    <div id="panelUsage" class="panel" hidden></div>
    <div id="panelSearch" class="panel" hidden></div>
    <div id="panelWeb" class="panel" hidden><form class="searchbar"><input type="search" placeholder="Search the web or paste a URL (opens a new browser tab)" autocomplete="off" /></form></div>
  </main>
  <div id="termPanel" hidden>
    <div id="termGrip" title="Drag to resize"></div>
    <div class="thead"><b>Terminal</b><select id="termSession" aria-label="herdr session"></select><span id="termRole"></span><span class="sp"></span><button type="button" id="termClose">Close</button></div>
    <div id="termBody"><div id="termHost"></div><div id="termOverlay" hidden></div></div>
  </div>
  <script type="module" src="./main.ts"></script>
  <dialog id="health"><div class="hhead"><b>Health</b><button type="button" id="healthClose">Close</button></div><div id="healthBody"></div></dialog>
  <dialog id="hsessions"><div class="hhead"><b>Sessions</b><button type="button" id="hsClose">Close</button></div><div id="hsBody"></div><form id="hsPin" hidden><label></label><div class="row"><input type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Session PIN" /><button class="primary">OK</button></div></form></dialog>
  <dialog id="schedules"><div class="hhead"><b>Schedules</b><button type="button" id="schedClose">Close</button></div><div id="schedBody"></div></dialog>
</body>
</html>
