<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>agent-desk</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <strong>agent-desk</strong>
    <nav id="tabs">
      <button data-mode="ask" class="on">Ask</button>
      <button data-mode="design">Design</button>
      <button data-mode="code">Code</button>
      <button data-mode="notes" disabled>Notes</button>
      <button data-mode="usage" disabled>Usage</button>
      <button data-mode="search" disabled>Search</button>
    </nav>
    <span id="status">offline</span>
  </header>
  <main>
    <aside>
      <h3>Sources</h3>
      <ul id="sources"></ul>
      <form id="attach"><input name="location" placeholder="/path or https://…" required /><button>Attach</button></form>
      <h3>Threads</h3>
      <ul id="threads"></ul>
      <button id="newThread" hidden>New</button>
    </aside>
    <section>
      <div id="cards"></div>
      <form id="prompt"><textarea name="text" rows="3" placeholder="Message (Ctrl+Enter to send)"></textarea><button>Send</button></form>
    </section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
