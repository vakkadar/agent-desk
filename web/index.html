<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>agent-desk</title>
  <link rel="stylesheet" href="./style.css" />
  <script>
    // Apply saved theme before first paint (no flash).
    try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span>agent-desk</div>
    <nav id="tabs">
      <button data-mode="ask" class="on">Ask</button>
      <button data-mode="design">Design</button>
      <button data-mode="code">Code</button>
      <button data-mode="notes" disabled>Notes</button>
      <button data-mode="usage" disabled>Usage</button>
      <button data-mode="search" disabled>Search</button>
    </nav>
    <span id="status">offline</span>
    <button id="theme" type="button">◐ Auto</button>
  </header>
  <main>
    <aside>
      <h3>Sources</h3>
      <ul id="sources"></ul>
      <form id="attach">
        <div class="kinds">
          <label><input type="radio" name="kind" value="local" checked /> Local folder</label>
          <label><input type="radio" name="kind" value="url" /> URL</label>
        </div>
        <div class="row">
          <input name="location" list="locs" autocomplete="off" placeholder="~/projects/…" required />
          <button type="button" id="browse">Browse…</button>
          <button class="primary">Attach</button>
        </div>
        <div id="browser" hidden>
          <div class="cwd"></div>
          <ul></ul>
          <div class="row">
            <button type="button" id="pickDir">Select this folder</button>
            <button type="button" id="closeBrowser">Cancel</button>
          </div>
        </div>
        <datalist id="locs"></datalist>
      </form>
      <h3>Threads</h3>
      <ul id="threads"></ul>
      <button id="newThread" hidden>New</button>
    </aside>
    <section>
      <div id="cards"></div>
      <form id="prompt"><textarea name="text" rows="3" placeholder="Message (Ctrl+Enter to send)"></textarea><button class="primary">Send</button></form>
    </section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
