<style>
/* Desk (beta). Live when a desk server answers on /ws (desk2-live.js); made-up data otherwise.
   Rule: the working area is the text box + output. Everything else is summoned (Ctrl+K, a click) and goes away. */
:root {
  color-scheme: light;
  --bg: #f6f7f9; --panel: #ffffff; --card: #ffffff; --sunk: #eff1f4; --hover: #f1f2f5;
  --fg: #1b1d22; --mute: #697080; --line: #e4e6eb; --line2: #d3d6dd;
  --acc: #4f46e5; --acc-fg: #fff; --acc-soft: rgba(79,70,229,.10);
  --ok: #1a8f4c; --ok-soft: rgba(26,143,76,.12); --warn: #c23b3b; --warn-soft: rgba(194,59,59,.10);
  --amber: #b45309; --amber-soft: rgba(180,83,9,.12); --blue: #2563eb; --blue-soft: rgba(37,99,235,.10);
  --add-bg: #e6f6ea; --add-fg: #116b37; --del-bg: #fdeceb; --del-fg: #a12a2a;
  --shadow: 0 1px 2px rgba(16,18,24,.05), 0 4px 14px rgba(16,18,24,.05); --pop: 0 14px 44px rgba(16,18,24,.2);
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1014; --panel: #14171c; --card: #191c22; --sunk: #101318; --hover: #1d2027;
  --fg: #e6e8ec; --mute: #8f96a2; --line: #252a32; --line2: #353b46;
  --acc: #8b8df9; --acc-fg: #0e1014; --acc-soft: rgba(139,141,249,.15);
  --ok: #4ade80; --ok-soft: rgba(74,222,128,.13); --warn: #f27474; --warn-soft: rgba(242,116,116,.13);
  --amber: #fbbf24; --amber-soft: rgba(251,191,36,.13); --blue: #60a5fa; --blue-soft: rgba(96,165,250,.13);
  --add-bg: rgba(46,160,67,.18); --add-fg: #7ee2a0; --del-bg: rgba(248,81,73,.15); --del-fg: #ffa198;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --pop: 0 14px 44px rgba(0,0,0,.6);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1014; --panel: #14171c; --card: #191c22; --sunk: #101318; --hover: #1d2027;
    --fg: #e6e8ec; --mute: #8f96a2; --line: #252a32; --line2: #353b46;
    --acc: #8b8df9; --acc-fg: #0e1014; --acc-soft: rgba(139,141,249,.15);
    --ok: #4ade80; --ok-soft: rgba(74,222,128,.13); --warn: #f27474; --warn-soft: rgba(242,116,116,.13);
    --amber: #fbbf24; --amber-soft: rgba(251,191,36,.13); --blue: #60a5fa; --blue-soft: rgba(96,165,250,.13);
    --add-bg: rgba(46,160,67,.18); --add-fg: #7ee2a0; --del-bg: rgba(248,81,73,.15); --del-fg: #ffa198;
    --shadow: 0 1px 2px rgba(0,0,0,.4); --pop: 0 14px 44px rgba(0,0,0,.6);
  }
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
code { font: 12.5px var(--mono); background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.mute { color: var(--mute); }
.sp { flex: 1; }
.btn { border: 1px solid var(--line2); background: var(--card); border-radius: 8px; padding: 0 12px; min-height: 36px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--mute); }
.btn:disabled { opacity: .45; cursor: default; border-color: var(--line2); }
.btn.pri { background: var(--acc); border-color: var(--acc); color: var(--acc-fg); font-weight: 600; }
.btn.sm { min-height: 28px; padding: 0 9px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.hot { border-color: var(--amber); color: var(--amber); }
.ib { border: 0; background: none; min-width: 30px; height: 30px; border-radius: 7px; display: inline-grid; place-items: center; color: var(--mute); padding: 0 6px; }
.ib:hover { background: var(--hover); color: var(--fg); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.s-working { background: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); animation: pulse 1.6s infinite; }
.s-blocked { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
.s-done { background: var(--ok); } .s-idle { background: var(--line2); }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px transparent; } }
@media (prefers-reduced-motion: reduce) { .s-working { animation: none; } }
.kbd { font: 11px var(--mono); border: 1px solid var(--line2); border-radius: 4px; padding: 0 5px; color: var(--mute); }
.pill { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 5px; white-space: nowrap; }
.p-ok { background: var(--ok-soft); color: var(--ok); } .p-amber { background: var(--amber-soft); color: var(--amber); } .p-mute { background: var(--sunk); color: var(--mute); }
.p-red { background: var(--del-bg); color: var(--del-fg); }
/* forms in views (add project, history, notes, sign in) */
.inp { height: 36px; border: 1px solid var(--line2); border-radius: 8px; padding: 0 10px; background: var(--card); width: 100%; min-width: 0; }
.vform { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
.vform .crow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.blist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; max-height: 320px; overflow: auto; }
.blist button { border: 0; border-top: 1px solid var(--line); background: none; text-align: left; padding: 7px 10px; display: flex; gap: 8px; align-items: baseline; }
.blist button:first-child { border-top: 0; } .blist button:hover { background: var(--sunk); }
.blist .m { color: var(--mute); font-size: 12px; margin-left: auto; white-space: nowrap; }
.hit mark { background: var(--amber-soft); color: inherit; border-radius: 3px; }
.atts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.atts img { max-height: 120px; max-width: 160px; border-radius: 6px; border: 1px solid var(--line); display: block; }
.attchips { display: flex; flex-wrap: wrap; gap: 6px; }
.attchips .chip button { border: 0; background: none; padding: 0 4px; }
#runOn { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; color: var(--mute); }
#runOn[hidden], #runOn [hidden] { display: none; }
#runOn select { max-width: 14em; border: 1px solid var(--line2); border-radius: 6px; background: var(--card); height: 26px; }
/* terminal panel (bottom, like an editor's) */
#termPanel { position: fixed; left: 0; right: 0; bottom: 0; height: 40vh; z-index: 20; display: flex; flex-direction: column; background: var(--sunk); border-top: 1px solid var(--line2); box-shadow: var(--pop); }
#termPanel[hidden] { display: none; }
#termGrip { position: absolute; top: -3px; left: 0; right: 0; height: 6px; cursor: ns-resize; z-index: 3; touch-action: none; }
#termGrip:hover { background: var(--acc-soft); }
#termPanel .thead { display: flex; gap: 10px; align-items: center; padding: 4px 12px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 13px; }
#termPanel .thead select { border: 1px solid var(--line2); border-radius: 6px; background: var(--card); height: 26px; }
#termPanel .sp { flex: 1; }
#termBody { position: relative; flex: 1; min-height: 0; padding: 4px 8px; }
#termHost { position: absolute; inset: 4px 8px; }
#termOverlay { position: absolute; top: 8px; right: 14px; padding: 2px 10px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line2); color: var(--warn); font-size: 12px; z-index: 2; }
#termOverlay[hidden] { display: none; }
@media (max-width: 760px) { #termPanel { top: 0; height: auto !important; } #termGrip { display: none; } }
/* dialogs from desk2-extras.ts: health, sessions, schedules */
dialog.dlg { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--pop); width: min(520px, calc(100vw - 32px)); padding: 14px 16px; }
dialog.dlg::backdrop { background: rgba(0, 0, 0, 0.4); }
dialog.dlg .hhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
dialog.dlg button { border: 1px solid var(--line2); background: var(--card); border-radius: 8px; padding: 0 10px; min-height: 30px; }
dialog.dlg .srow, dialog.dlg .hrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
dialog.dlg .srow span { display: flex; flex-direction: column; min-width: 0; flex: 1; }
dialog.dlg small, dialog.dlg .hname { color: var(--mute); }
dialog.dlg select { border: 1px solid var(--line2); border-radius: 6px; background: var(--card); height: 30px; min-width: 10em; }
dialog.dlg .hname { width: 110px; flex: none; } dialog.dlg .hdet { flex: 1; min-width: 0; overflow-wrap: anywhere; }
dialog.dlg .hdot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--mute); }
dialog.dlg .hdot.ok { background: var(--ok); } dialog.dlg .hdot.warn { background: var(--amber); } dialog.dlg .hdot.fail { background: var(--warn); }
#hsPin { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; display: flex; flex-direction: column; gap: 6px; }
#hsPin[hidden] { display: none; } #hsPin .row { display: flex; gap: 8px; } #hsPin input { flex: 1; min-width: 0; }
.deskp { flex: none; margin: 10px 16px 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); display: flex; flex-direction: column; gap: 8px; }
.deskp .dh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.deskp .aprow { display: flex; align-items: center; gap: 8px; min-height: 30px; flex-wrap: wrap; }
.deskp .aprow .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deskp a.btn { text-decoration: none; display: inline-flex; align-items: center; }
body.lv-everyday .dev, body.lv-everyday .pow, body.lv-developer .pow { display: none !important; }

/* ---------- top bar ---------- */
header { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; padding-right: 6px; }
.brand i { width: 10px; height: 10px; border-radius: 3px; background: var(--acc); }
.kbar { flex: 0 1 520px; margin: 0 auto; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; color: var(--mute); text-align: left; }
.kbar > span:not(.kbd) { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.persp { display: inline-flex; border: 1px solid var(--line2); border-radius: 9px; padding: 2px; gap: 2px; background: var(--sunk); flex: none; }
.persp button { border: 0; background: none; border-radius: 7px; height: 30px; padding: 0 12px; font-size: 13px; color: var(--mute); display: inline-flex; align-items: center; gap: 6px; }
.persp button.on { background: var(--card); color: var(--fg); font-weight: 600; box-shadow: var(--shadow); }
.persp button .n { font-size: 11px; color: var(--mute); font-weight: 500; }
.app.p-ask .files, .app.p-ask .sash.h { display: none; }
.app.p-compute .files, .app.p-compute .sash.h, .app.p-compute .right, .app.p-compute .sash.r { display: none; }
.cmp { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; overflow: auto; min-height: 0; }
.cmp .mcard { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.cmp .mh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cmp .mh b { font-size: 15px; }
.cmp .agrp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cmp .cchat { display: flex; gap: 8px; align-items: flex-end; }
.cmp .cchat textarea { flex: 1; min-height: 56px; resize: vertical; font: inherit; }
.cmp .agrp > .lbl { font-size: 11.5px; color: var(--mute); width: 52px; flex: none; text-transform: uppercase; letter-spacing: .04em; }
.cmp .btn.armed { background: var(--red, #c0392b); color: #fff; border-color: transparent; }
.cmp pre { margin: 0; max-height: 360px; overflow: auto; font-size: 12px; background: var(--sunk); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; }
.cmp .note { font-size: 12.5px; color: var(--amber, #b7791f); }
.app.p-design .right { --rw-default: 60%; }
.need { position: relative; }
.need b { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--amber); color: #fff; font-size: 11px; display: grid; place-items: center; padding: 0 4px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--acc-soft); color: var(--acc); font-weight: 700; display: grid; place-items: center; border: 0; }

/* ---------- three areas ---------- */
.app { flex: 1; min-height: 0; display: flex; }
.left { width: var(--lw, 272px); flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.mid { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.right { width: var(--rw, 540px); flex: none; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.app.no-left .left, .app.no-left .sash.l, .app.no-right .right, .app.no-right .sash.r { display: none; }
.sash { width: 5px; margin: 0 -2px; cursor: col-resize; z-index: 3; flex: none; }
.sash:hover, .sash.drag { background: var(--acc); }
.sash.h { width: auto; height: 5px; margin: -2px 0; cursor: row-resize; }

/* left: places tree + files of the open thread */
.tree { flex: 1; overflow: auto; min-height: 0; padding: 6px 0 10px; }
.grp { display: flex; align-items: center; gap: 6px; padding: 10px 8px 4px 12px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
.grp .mach { text-transform: none; letter-spacing: 0; font-weight: 500; }
.grp .ib { width: 24px; min-width: 24px; height: 24px; margin-left: auto; }
.grp button.tg { border: 0; background: none; padding: 0; display: flex; align-items: center; gap: 6px; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
.grp button.tg::before { content: "▾"; font-size: 10px; width: 10px; }
.grp.closed button.tg::before { content: "▸"; }
.row { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; padding: 6px 12px 6px 14px; min-height: 34px; border-left: 2px solid transparent; }
.row:hover { background: var(--hover); }
.row.on { background: var(--acc-soft); border-left-color: var(--acc); }
.row .id { font: 600 12.5px var(--mono); flex: none; }
.row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { font-size: 11.5px; color: var(--mute); white-space: nowrap; }
.row.need-row { border-left-color: var(--amber); }
.row.rel { min-height: 28px; padding: 3px 12px 3px 30px; font-size: 12.5px; color: var(--mute); }
.row.rel .id { font-size: 12px; font-weight: 500; } .row.rel .rl { font-size: 11px; white-space: nowrap; }
.row.rel.on2 { background: var(--sunk); color: var(--fg); }
.relchip { border: 1px solid var(--line); background: var(--sunk); border-radius: 6px; padding: 0 7px; height: 24px; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; color: var(--mute); }
.relchip:hover { color: var(--fg); border-color: var(--line2); }
.relchip b { font: 600 12px var(--mono); color: var(--fg); }
.row.need-row .t { white-space: normal; font-size: 13px; }
.files { height: var(--fh, 260px); flex: none; border-top: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.files.min { height: 36px; } .files.min .fbody { display: none; }
.fhead { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 6px 0 12px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); flex: none; }
.fbody { flex: 1; overflow: auto; min-height: 0; padding-bottom: 8px; }
.fsub { padding: 6px 12px 2px; font-size: 11px; color: var(--mute); font-weight: 600; }
.frow { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; padding: 4px 12px; font-size: 12.5px; min-height: 28px; }
.frow:hover { background: var(--hover); } .frow.on { background: var(--acc-soft); }
.frow .st { font: 700 11px var(--mono); width: 12px; } .st.A { color: var(--ok); } .st.M { color: var(--amber); } .st.D { color: var(--warn); }
.frow .fn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; font: 12px var(--mono); }
.frow .ct { font: 11px var(--mono); white-space: nowrap; } .ct .a { color: var(--ok); } .ct .d { color: var(--warn); }

/* middle: one thin thread line, the text box, the output */
.tline { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; white-space: nowrap; overflow: hidden; font-size: 13px; }
.tline .ttl { overflow: hidden; text-overflow: ellipsis; min-width: 90px; flex-shrink: 1; }
.tline .meta, .tline .relchip { flex-shrink: 0; }
.tline .meta { color: var(--mute); font-size: 12px; }
.ctxm { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--mute); }
.ctxm i { width: 46px; height: 5px; border-radius: 3px; background: var(--sunk); overflow: hidden; display: inline-block; }
.ctxm i b { display: block; height: 100%; background: var(--acc); }
.ctxm.hi i b { background: var(--amber); } .ctxm.hi { color: var(--amber); }
.box { padding: 14px 16px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
.cbox { border: 1.5px solid var(--line2); border-radius: 12px; background: var(--card); box-shadow: var(--shadow); }
.cbox:focus-within { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
.cbox textarea { display: block; width: 100%; border: 0; outline: 0; background: transparent; resize: vertical; min-height: 128px; max-height: 50vh; padding: 12px 14px 4px; font-size: 15px; line-height: 1.55; }
.crow { display: flex; align-items: center; gap: 8px; padding: 8px 10px 10px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line2); background: var(--sunk); font-size: 12.5px; white-space: nowrap; }
.chip.pfx { font-family: var(--mono); color: var(--acc); background: var(--acc-soft); border-color: transparent; font-weight: 600; }
.chip select { border: 0; background: transparent; padding: 0; font-size: 12.5px; outline: 0; }
.send { min-width: 104px; justify-content: center; font-size: 14px; }
.hint { font-size: 12px; color: var(--mute); padding: 0 16px 0 2px; }
.out { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.out > * { flex: none; }
.turn { max-width: 880px; display: flex; flex-direction: column; gap: 4px; }
.turn .who { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mute); }
.turn .who b { color: var(--fg); }
.turn .body { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.turn.me { align-self: flex-end; max-width: 760px; }
.turn.me .body { background: var(--acc-soft); border-color: transparent; box-shadow: none; }
.turn.me .who { justify-content: flex-end; }
.fold { border: 1px solid var(--line); border-radius: 8px; font-size: 12.5px; }
.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 6px 10px; min-height: 32px; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::after { content: "▸"; margin-left: auto; color: var(--mute); } .fold[open] > summary::after { content: "▾"; }
.fold .fb { padding: 2px 10px 10px; display: flex; flex-direction: column; gap: 4px; }
.step { font: 12px var(--mono); color: var(--mute); display: flex; gap: 8px; }
.step .ok { color: var(--ok); }

<script>
// ================= fake data =================

// Compute perspective: machines and hosting accounts (live: compute_state from <data>/compute.toml).

  { id: "hostinger", label: "Hostinger VPS", group: "Cloud", os: "vps", online: true, power: "running", actions: [{ id: "vps:start", label: "Start VPS", group: "power" }, { id: "vps:restart", label: "Restart VPS", group: "power", confirm: true }, { id: "vps:stop", label: "Stop VPS", group: "power", confirm: true }, { id: "hostinger:vm", label: "This VPS", group: "api" }, { id: "hostinger:metrics", label: "Metrics (24 h)", group: "api" }, { id: "hostinger:dns", label: "DNS zone", group: "api", param: "domain" }] },

const OS_ICON = { linux: "🐧", macos: "", windows: "⊞", ios: "📱", vps: "☁", domains: "🌐" };
function machineDot(m) { return m.online ? "var(--ok)" : m.online === false ? "var(--mute)" : m.power === "running" || m.power === "on" ? "var(--ok)" : "var(--line2)"; }
function computeTree() {

  if (d.mach) { COMPUTE.sel = d.mach; COMPUTE.arm = null; if (phone()) openThreadScreen(true); renderTree(); return renderMid(); }
  if (d.cact) {
    const m = COMPUTE.machines.find((x) => x.id === COMPUTE.sel), a = m?.actions.find((x) => x.id === d.cact);
    if (!a) return;
    const param = a.param ? ($("cparamIn")?.value.trim() ?? "") : "";
    if (a.param && !param) { $("cparamIn")?.focus(); return toast(`Type a ${a.param} first`); }
    const key = m.id + "|" + a.id;
    if (a.confirm && COMPUTE.arm !== key) { COMPUTE.arm = key; clearTimeout(COMPUTE.armT); COMPUTE.armT = setTimeout(() => { COMPUTE.arm = null; renderMid(); }, 4000); return renderMid(); }
    COMPUTE.arm = null; toast(`${a.label}: ${m.label}…`);
    return computeRun(m.id, a.id, param);
  }
  if (d.go) { const [p, t] = d.go.split("|"); return go(p, t); }
  if (d.tg) { S.closed[d.tg] = !S.closed[d.tg]; return renderTree(); }
  if (d.new) { return go(d.new, null); }
  if (d.rel) { const fs = FILES[d.rel] || []; const main = fs.find((x) => x.design) ?? fs.find((x) => !isSupport(x.path)) ?? fs[0];
    if (!main) return toast(`${d.rel} has no files yet`);
    S.fileOwner = d.rel; S.file = main.path; S.fileMode = main.design ? "preview" : "diff"; renderTree(); renderFiles(); renderRight(); return layout(); }
  if (d.gorel) { const pl = PLACES.find((x) => (THREADS[x.id] || []).some((y) => y.id === d.gorel)); return go(pl.id, d.gorel); }
  if (d.file) { closeMenu(); S.fileOwner = null; S.file = d.file; renderFiles(); renderRight(); return layout(); }
  if (d.fmode) { S.fileMode = d.fmode; return renderRight(); }
  if (d.base) { S.diffBase = d.base; toast(d.base === "branch" ? "Diff since the thread's branch left main" : "Diff since your last message"); return renderRight(); }
  if (d.dispute) { S.dispute = d.dispute; return renderMid(); }
  if (d.akind) { S.akind = d.akind; return renderMid(); }
  if (d.deskRevert) { if (!d.armed) { d.armed = "1"; el.textContent = "Confirm revert"; el.classList.add("pri"); return; } return act("deskRevert", el); } // two clicks: it restarts the desk
  if (d.level) { S.level = d.level; if (d.level === "everyday" && S.persp !== "ask") switchPersp("ask"); if (!dv() && S.place !== "general") { S.place = "general"; S.thread = "q-14"; } closeMenu(); return render(); }
  if (d.cmd) { closeMenu(); if (d.cmd === "/<command>") { const ta = $("msg"); ta.value = "/" + ta.value; return ta.focus(); } return toast(`${d.cmd} sent as typed`); }
  if (d.pfx) { closeMenu(); const ta = $("msg"); if (!ta.value.startsWith(d.pfx)) ta.value = d.pfx + ta.value; return ta.focus(); }
  if (d.pi) return palItems[+d.pi].run();
  if (d.act) return act(d.act, el);
});
document.addEventListener("dblclick", (e) => { const el = e.target.closest("[data-rel]"); if (el) { const pl = PLACES.find((x) => (THREADS[x.id] || []).some((y) => y.id === el.dataset.rel)); go(pl.id, el.dataset.rel); } });
document.addEventListener("change", (e) => { const s = e.target.dataset?.sel; if (s === "relfile") { S.file = e.target.value; const fm = (FILES[S.fileOwner] || []).find((x) => x.path === S.file); S.fileMode = fm?.design ? "preview" : "diff"; return renderRight(); } if (s === "target") { S.target = e.target.value; persist(); } });
$("palIn").addEventListener("input", () => { palSel = 0; renderPal(); });
$("palIn").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { palSel = Math.min(palSel + 1, palItems.length - 1); renderPal(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { palSel = Math.max(palSel - 1, 0); renderPal(); e.preventDefault(); }
  else if (e.key === "Enter" && palItems[palSel]) palItems[palSel].run();
});
document.addEventListener("keydown", (e) => {
  const c = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (c && k === "k") { e.preventDefault(); pal(!$("pal").classList.contains("on")); }
  else if (e.altKey && ["1", "2", "3", "4", "5"].includes(e.key) && dv() && (e.key !== "4" || S.deskDev) && (e.key !== "5" || S.compute)) { e.preventDefault(); switchPersp({ 1: "ask", 2: "design", 3: "code", 4: "desk", 5: "compute" }[e.key]); }
  else if (c && k === "b") { e.preventDefault(); act("toggleLeft"); }
  else if (e.key === "Escape") { pal(false); closeMenu(); if (S.file) { S.file = null; renderFiles(); renderRight(); } }
  else if (e.key === "/" && !e.target.closest("textarea, input")) { e.preventDefault(); $("msg")?.focus(); }
});
document.addEventListener("pointerdown", (e) => {
  const el = e.target.closest(".sash"); if (!el) return;
  const k = el.dataset.sash, vert = k === "fh", start = vert ? e.clientY : e.clientX, from = S[k];
  el.classList.add("drag"); el.setPointerCapture(e.pointerId);
  const mv = (ev) => { const dd = (vert ? ev.clientY : ev.clientX) - start; S[k] = Math.max(vert ? 80 : 200, Math.min(vert ? innerHeight - 200 : 900, k === "lw" ? from + dd : from - dd)); layout(); };
  const up = () => { el.classList.remove("drag"); el.removeEventListener("pointermove", mv); el.removeEventListener("pointerup", up); };
  el.addEventListener("pointermove", mv); el.addEventListener("pointerup", up);
});
// demo deep links: ?place=agent-desk&thread=code-3&file=src/types.ts&theme=dark&level=everyday&open=1
{ const q = new URLSearchParams(location.search);
  if (q.get("theme")) document.documentElement.dataset.theme = q.get("theme");
  if (q.get("level")) S.level = q.get("level");
  if (q.get("place")) { S.place = q.get("place"); S.thread = q.get("thread"); }
  if (q.get("file")) S.file = q.get("file");
  if (q.get("persp")) { S.persp = q.get("persp"); if (S.persp === "design") { S.rw = Math.round(innerWidth * 0.5); autoPreview(); } }
  if (q.get("rel")) { const fs = FILES[q.get("rel")] || []; const m = fs.find((x) => x.design) ?? fs[0]; if (m) { S.fileOwner = q.get("rel"); S.file = m.path; S.fileMode = m.design ? "preview" : "diff"; } }
  if (q.get("open") && phone()) openThreadScreen(true); }
render();
</script>
